:max(22px,env(safe-area-inset-bottom));left:max(22px,env(safe-area-inset-left));right:max(22px,env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between}.demo-label{font-size:9px;letter-spacing:2px;color:var(--muted);opacity:.7}.selection-screen{padding:74px 24px 32px;overflow:auto;scrollbar-width:none}.selection-screen::-webkit-scrollbar{display:none}.selection-screen>h1{text-align:center;font-size:27px;font-weight:600;margin:4px 0 24px}.category-list{display:grid;gap:12px;max-width:360px;margin:auto}.category-list .card{width:100%;text-align:center;min-height:50px;font-size:17px}.category-list .card small{font-size:11px;opacity:.6;margin-left:10px}.demo-note{font-size:10px;color:var(--muted);text-align:center;line-height:1.8;margin:20px 0 0}.corner-left{position:fixed;top:max(18px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left));z-index:2}.play-top{position:absolute;top:max(18px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left));right:max(18px,env(safe-area-inset-right));display:flex;justify-content:space-between;z-index:2;pointer-events:none}.play-top>button{pointer-events:auto}.board-wrap{position:absolute;inset:74px 4px 70px;background:transparent;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.play-demo{position:absolute;bottom:22px;left:50%;transform:translateX(-50%)}.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);font-size:13px}.solved{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:12px;align-items:center;width:min(320px,calc(100% - 48px))}.solved>button{width:100%;min-height:48px}.solved>span{color:var(--accent);font-size:23px}.finished .board-wrap{bottom:215px}.finished .play-demo{display:none}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap; <body>
<main class="app">
  <section id="home" class="home-screen">
    <button class="icon-button glass audio-corner" id="audio" aria-label="Sound" title="Sound"><span data-icon="sound"></span></button>
    <div class="home-center"><h1 class="logo" aria-label="Infograf"><span>Info</span><i>graf</i></h1><div class="home-actions"><button id="resume-home" class="primary" hidden>Continue</button><button id="random-home" class="primary">Random</button><button id="categories-home" class="glass">Categories</button></div></div>
    <div class="home-corners"><button class="icon-button glass" id="theme" aria-label="Theme: System" title="Theme: System"><span data-icon="sun"></span></button><div class="home-store"><span class="demo-label">DEMO</span><a class="play-badge" href="https://play.google.com/store/apps/details?id=com.jachsugames.infograf" target="_blank" rel="noopener noreferrer"><img src="assets/google-play-badge-en.png" width="144" height="43" alt="Get it on Google Play"></a></div><button class="icon-button glass" id="collection" aria-label="Gallery" title="Gallery"><span data-icon="gallery"></span></button></div>
  </section>
  <section id="gallery" class="selection-screen" hidden><button class="icon-button glass corner-left" id="selection-back" aria-label="Main menu"><span data-icon="back"></span></button><h1>Categories</h1><div id="cards" class="category-list"></div><p id="collection-count" class="demo-note">Demo · one picture per category</p></section>
  <section id="play" class="play" hidden>
    <div class="play-top"><button class="icon-button glass" id="pause" aria-label="Pause" title="Pause"><span data-icon="pause"></span></button><div class="visually-hidden"><span id="category"></span><h1 id="card-title"></h1></div><button class="icon-button glass" id="flip" aria-label="Flip card" title="Flip card"><span data-icon="flip"></span><span class="visually-hidden" id="flip-label">Flip card</span></button></div>
    <div id="board-wrap" class="board-wrap"><canvas id="board" tabindex="0" role="application" aria-label="Puzzle board. Drag pieces to move them. Keyboard: arrows select a group, Space picks it up, arrows move it, Enter drops it, Escape cancels."></canvas><div class="loading" id="loading">Preparing picture…</div></div>
    <div id="solved" class="solved" hidden><span>✓</span><button class="glass" id="solved-flip">Flip card</button><button class="primary" id="next">Next</button></div>
    <span class="play-demo demo-label">DEMO</span>
    <div hidden><button id="back">Main menu</button><button id="preview">View picture</button><button id="hint">Hint</button><button id="credits">Image credits</button><span id="group-stat"></span><span id="moves-stat"></span><div id="progress-bar"></div><span id="board-caption"></span></div>
  </section>
</main>

<script>const DEMO_CARDS = [{"id": "red_panda", "title": "Red panda", "text": "The red panda lives among the trees and bamboo of cool mountain forests in Asia. Curved claws help it grip branches, while its long, ringed tail provides balance as it moves above the ground. An enlarged wrist bone acts like an extra thumb, helping it hold bamboo while feeding. Although it belongs to the order that includes many meat-eating mammals, bamboo makes up most of its diet. It has its own animal family, separate from the giant panda and other bears.", "category": "Animals", "grids": [[5, 2], [7, 4], [8, 5]], "aspect": 1.509433962264151, "image": "assets/images/red_panda.jpg", "author": "Mathias Appel", "license": "CC0", "licenseUrl": "https://creativecommons.org/publicdomain/zero/1.0/", "source": "https://commons.wikimedia.org/w/index.php?oldid=1278871703", "sourceSha256": "4f025f4d641206e671d7ea8c2f2403c0439afe7532371b2b48dfad3dd53b8bd5", "adaptation": "Full image preserved; resized to a maximum of 1200 px and compressed as JPEG for this demo."}, {"id": "sunflower_close", "title": "Sunflower", "text": "A sunflower looks like one enormous flower, but its head is a community of many smaller flowers. The bright outer rays surround a central disc packed with tiny florets, arranged in intersecting spirals. As the head matures, it becomes a rich source of seeds for birds and other wildlife. The common sunflower is an annual plant with a tall, rough stem and large leaves. Garden varieties range from compact plants to towering stems, and their flower heads can be yellow, red, bronze, or even pale white.", "category": "Plants", "grids": [[5, 2], [7, 4], [8, 5]], "aspect": 1.26, "image": "assets/images/sunflower_close.jpg", "author": "Don McCulley", "license": "CC0", "licenseUrl": "https://creativecommons.org/publicdomain/zero/1.0/", "source": "https://commons.wikimedia.org/w/index.php?oldid=1053774562", "sourceSha256": "3e2f7dcc69e6fd59ecc83ecb146f06a8adc7221df9a4d24ce6fc388efd921413", "adaptation": "Full image preserved; resized to a maximum of 1200 px and compressed as JPEG for this demo."}, {"id": "saturn", "title": "Saturn", "text": "Saturn is the sixth planet from the Sun and the second largest in our solar system. From a distance, its rings look like a single band, but they are actually made of countless pieces of ice, rock, and dust circling the planet. Each piece follows its own orbit, so the rings are a vast collection of separate objects. Saturn is a gas giant and has no solid surface that you could stand on.", "category": "Space", "grids": [[2, 5], [4, 7], [5, 8]], "aspect": 0.6457461645746164, "image": "assets/images/saturn.jpg", "author": "NASA/JPL — Voyager 2", "license": "Public domain (USA; PD-USGov-NASA)", "licenseUrl": "https://commons.wikimedia.org/wiki/Template:PD-USGov-NASA", "source": "https://commons.wikimedia.org/w/index.php?oldid=1140983316", "sourceSha256": "dc75a95700261f66ff14306ab56e9fb8e43150163b8318d9703a685e70fdd83d", "adaptation": "Full image preserved; resized to a maximum of 1200 px and compressed as JPEG for this demo."}, {"id": "yosemite_falls", "title": "Yosemite Falls", "text": "Yosemite Falls descends from the granite cliffs of California's Yosemite Valley in three sections: an upper fall, a series of middle cascades, and a lower fall. Together, these drops form one of the world's tallest waterfalls. The flow changes dramatically through the year. Melting mountain snow feeds the streams in spring, often producing the strongest display in late spring. By late summer, the falls can become much quieter or dry up, before autumn storms and the next winter's snowfall renew the cycle.", "category": "Landscapes", "grids": [[2, 5], [4, 7], [5, 8]], "aspect": 0.75, "image": "assets/images/yosemite_falls.jpg", "author": "Alex Demas, U.S. Geological Survey", "license": "CC0", "licenseUrl": "https://creativecommons.org/publicdomain/zero/1.0/", "source": "https://commons.wikimedia.org/w/index.php?oldid=1221793507", "sourceSha256": "b45667436256dbfbb4be4908db8a24d46f50ee4c3e0af51ebe210b9015a3c916", "adaptation": "Full image preserved; resized to a maximum of 1200 px and compressed as JPEG for this demo."}, {"id": "quartz", "title": "Quartz", "text": "Quartz is made of silicon and oxygen and occurs in many kinds of rock. It can be clear, cloudy, or colored, and it does not always appear as a neat, pointed crystal. In many rocks, quartz grains have no well-developed outer faces because they grew among other minerals. This specimen from Texas is unusually large, measuring about eighteen centimeters along its longest dimension. Its broad crystal faces offer a different view of a mineral that is common across the Earth.", "category": "Minerals", "grids": [[5, 2], [7, 4], [8, 5]], "aspect": 1.3879957127545552, "image": "assets/images/quartz.jpg", "author": "Twyla Baker", "license": "CC0", "licenseUrl": "https://creativecommons.org/publicdomain/zero/1.0/", "source": "https://commons.wikimedia.org/w/index.php?oldid=1263136269", "sourceSha256": "06442fcde95feae6628890a6ae165be4e6d8474fc2d91758485e7bb03e194b21", "adaptation": "Full image preserved; resized to a maximum of 1200 px and compressed as JPEG for this demo."}, {"id": "marie_curie", "title": "Marie Curie", "text": "Marie Curie studied radioactivity, a property that allows some elements to give off energy from within their atoms. Working with Pierre Curie, she investigated minerals and helped discover polonium and radium. Born Maria Skłodowska in Warsaw, she later continued her studies in Paris. She shared the Nobel Prize in Physics in 1903 and received the Nobel Prize in Chemistry in 1911, becoming the first person to receive two Nobel Prizes.", "category": "People", "grids": [[2, 5], [4, 7], [5, 8]], "aspect": 0.6452719255267026, "image": "assets/images/marie_curie.jpg", "author": "Henri Manuel / Wellcome Collection", "license": "CC BY 4.0", "licenseUrl": "https://creativecommons.org/licenses/by/4.0/", "source": "https://commons.wikimedia.org/w/index.php?oldid=1131488390", "sourceSha256": "ea0ba2928a092c44c6e58065c085abb8abe1d7143e6aa5e222b7d9a78f8565d3", "adaptation": "Full image preserved; resized to a maximum of 1200 px and compressed as JPEG for this demo."}, {"id": "starry_night_over_the_rhone", "title": "Starry Night over the Rhône", "text": "“Starry Night over the Rhône” shows a night scene painted by Vincent van Gogh in Arles in 1888. Bright lights along the riverbank stretch into long reflections on the water, while stars glow above the blue landscape. Two figures stand near the foreground, giving the broad view a human scale. Van Gogh explored how color could convey the atmosphere of night. This river scene is different from his later painting of a swirling sky above Saint-Rémy.", "category": "Art", "grids": [[5, 2], [7, 4], [8, 5]], "aspect": 1.2943813508667066, "image": "assets/images/starry_night_over_the_rhone.jpg", "author": "Vincent van Gogh; Musée d’Orsay; reprodukcja Google Arts & Culture", "license": "Public domain (szczegółowa podstawa w license_basis)", "licenseUrl": "https://commons.wikimedia.org/wiki/Template:PD-Art", "source": "https://commons.wikimedia.org/w/index.php?oldid=1166741669", "sourceSha256": "3d87c7270b0e4be125c9d0db98aee77f010144384137948e1217806dede62892", "adaptation": "Full image preserved; resized to a maximum of 1200 px and compressed as JPEG for this demo."}, {"id": "cma_169914", "title": "Pyramids of Giza", "text": "“Pyramids of Giza” presents architecture through an artist’s choices of viewpoint, scale and the handling of light. The pyramids rise above a broad, open landscape, making their geometric outlines especially clear. Lithography transfers a drawn design from a prepared surface. Its marks can preserve the freedom of a sketch while allowing several impressions of the same image.", "category": "Architecture", "grids": [[5, 2], [7, 4], [8, 5]], "aspect": 1.4072847682119205, "image": "assets/images/cma_169914.jpg", "author": "Louis Haghe (British, 1806–1885) [artist]; F. G. Moon, 20 Threadneedle Street, London [published by]; David Roberts (Scottish, 1796–1864) [artist; after]", "license": "CC0 1.0", "licenseUrl": "https://creativecommons.org/publicdomain/zero/1.0/", "source": "https://clevelandart.org/art/2012.155", "sourceSha256": "625b3f69213156197c31393ef3c88d76d45b22e95cd9e1937f0b1d55ee5c6c39", "adaptation": "Full image preserved; resized to a maximum of 1200 px and compressed as JPEG for this demo."}];

class PuzzleEngine {
  constructor(cols, rows, positions) {
    this.cols = cols; this.rows = rows; this.count = cols * rows;
    this.positions = positions ? positions.map(p => ({...p})) : Array.from({length: this.count}, (_, i) => ({x: i % cols, y: 1 + Math.floor(i / cols)}));
    if (!this.valid()) throw new Error('Invalid puzzle positions');
  }
  valid() {
    return this.positions.length === this.count && this.positions.every(p => Number.isInteger(p.x) && Number.isInteger(p.y) && p.x >= 0 && p.x < this.cols && p.y >= 0 && p.y < this.rows + 2) && new Set(this.positions.map(p => `${p.x},${p.y}`)).size === this.count;
  }
  groups() {
    const groups = [], seen = new Set();
    for (let i = 0; i < this.count; i++) {
      if (seen.has(i)) continue;
      const group = [i]; seen.add(i);
      for (let k = 0; k < group.length; k++) {
        const a = group[k], ax = a % this.cols, ay = Math.floor(a / this.cols);
        for (const b of [a - 1, a + 1, a - this.cols, a + this.cols]) {
          if (b < 0 || b >= this.count || seen.has(b)) continue;
          const bx = b % this.cols, by = Math.floor(b / this.cols);
          if (Math.abs(ax - bx) + Math.abs(ay - by) !== 1) continue;
          if (this.positions[b].x - this.positions[a].x === bx - ax && this.positions[b].y - this.positions[a].y === by - ay) {seen.add(b); group.push(b);}
        }
      }
      groups.push(group);
    }
    return groups;
  }
  solved() { return this.groups().length === 1; }
  plan(id, dx, dy) {
    if (!Number.isInteger(id) || id < 0 || id >= this.count || !Number.isInteger(dx) || !Number.isInteger(dy) || (!dx && !dy)) return null;
    const groups = this.groups(), moving = groups.find(g => g.includes(id));
    const moved = new Set(moving), key = p => `${p.x},${p.y}`;
    const inside = p => p.x >= 0 && p.x < this.cols && p.y >= 0 && p.y < this.rows + 2;
    const next = this.positions.map(p => ({...p}));
    for (const i of moving) { next[i] = {x: next[i].x + dx, y: next[i].y + dy}; if (!inside(next[i])) return null; }
    const targets = new Set(moving.map(i => key(next[i])));
    const hit = groups.filter(g => g !== moving && g.some(i => targets.has(key(this.positions[i]))));

canvas.addEventListener('pointermove', e => {
  if (!drag || drag.pointer!==e.pointerId) return;
  const q=point(e), {tw,th}=geometry;
  if(!drag.active&&Math.hypot(q.x-drag.start.x,q.y-drag.start.y)<Math.min(6,tw*.2,th*.2))return;
  drag.active=true;drag.ox=q.x-drag.start.x; drag.oy=q.y-drag.start.y;
  const minX=Math.min(...drag.ids.map(i=>visual[i].x)),maxX=Math.max(...drag.ids.map(i=>visual[i].x));
  const minY=Math.min(...drag.ids.map(i=>visual[i].y)),maxY=Math.max(...drag.ids.map(i=>visual[i].y));
  drag.ox=Math.max(-minX*tw,Math.min((engine.cols-1-maxX)*tw,drag.ox)); drag.oy=Math.max(-minY*th,Math.min((engine.rows+1-maxY)*th,drag.oy));
  const dx=Math.round(visual[drag.id].x-engine.positions[drag.id].x+drag.ox/tw),dy=Math.round(visual[drag.id].y-engine.positions[drag.id].y+drag.oy/th);
  if(dx!==drag.dx || dy!==drag.dy) {drag.dx=dx;drag.dy=dy;drag.invalid=Boolean((dx||dy)&&!engine.plan(drag.id,dx,dy));}
  draw();
});
canvas.addEventListener('pointerup', e => {
  if(!drag || drag.pointer!==e.pointerId) return;
  const d=drag,q=point(e),r=canvas.getBoundingClientRect();
  if(q.x<0||q.y<0||q.x>r.width||q.y>r.height) {cancelDrag();return;}
  if(!d.active || (!d.dx&&!d.dy)) {cancelDrag();return;}
  const next=engine.plan(d.id,d.dx,d.dy); if(next) commit(next); else {cancelDrag();toast('This group needs more room. Try an empty row.');}
});
canvas.addEventListener('pointercancel',cancelDrag); canvas.addEventListener('lostpointercapture',cancelDrag);
window.addEventListener('blur',cancelDrag); document.addEventListener('visibilitychange',()=>{cancelDrag();persist();syncAudio();});
canvas.addEventListener('focus',draw); canvas.addEventListener('blur',()=>{cancelDrag();draw();});
canvas.addEventListener('keydown', e => {
  if(!engine || !front || paused || engine.solved())return;
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Enter','Escape'].includes(e.key))return;
  e.preventDefault(); const groups=engine.groups();
  keyboardMode=true;
  if(e.key==='Escape'){cancelDrag();return;}
  if(!drag) {
    if(e.key==='ArrowRight'||e.key==='ArrowDown')selected=(selected+1)%groups.length;
    if(e.key==='ArrowLeft'||e.key==='ArrowUp')selected=(selected+groups.length-1)%groups.length;
    if(e.key===' '||e.key==='Enter')drag={id:groups[selected][0],ids:groups[selected],dx:0,dy:0,ox:0,oy:0,keyboard:true};
  } else if(drag.keyboard) {
    if(e.key==='Enter'||e.key===' '){const next=engine.plan(drag.id,drag.dx,drag.dy);if(next)commit(next);else cancelDrag();return;}
    const dx=drag.dx+(e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0),dy=drag.dy+(e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0);
    const inside=drag.ids.every(i=>{const p=engine.positions[i];return p.x+dx>=0&&p.x+dx<engine.cols&&p.y+dy>=0&&p.y+dy<engine.rows+2;});
    if(inside){drag.dx=dx;drag.dy=dy;drag.ox=dx*geometry.tw;drag.oy=dy*geometry.th;drag.invalid=!!(dx||dy)&&!engine.plan(drag.id,dx,dy);}
  }
  draw();
});
$('flip').onclick=()=>{cancelDrag();if(!front)return;side=side==='front'?'back':'front';updateUI();persist();draw();};
$('preview').onclick=()=>{if(!front)return;const image=side==='front'?current.image:back.toDataURL();showDialog(`<img class="preview-image" src="${image}" alt="${side==='front'?current.title:'The complete story'}"><p style="text-align:center">${side==='front'?current.title:'The complete story · the same pieces as the picture'}</p>`,true);};
$('hint').onclick=()=>{cancelDrag();if(!engine||engine.solved())return;const hint=engine.hint();if(hint){commit(engine.plan(hint.id,hint.dx,hint.dy));if(!engine.solved())toast(hint.preparation?'Made room for the next connection.':'Matching pieces joined. Your turn.');}else toast('Make room by moving a group to an empty row above or below the picture.');};
$('back').onclick=home;
$('selection-back').onclick=home;
$('categories-home').onclick=gallery;
$('random-home').onclick=()=>choose(DEMO_CARDS[Math.floor(Math.random()*DEMO_CARDS.length)]);
$('collection').onclick=()=>{
  const cards=DEMO_CARDS.filter(c=>saved.completed.includes(c.id));
  showDialog(`<h2>Gallery</h2>${cards.length?'<div class="collection-grid">'+cards.map(c=>`<button data-card="${c.id}"><img src="${c.image}" alt="${c.title}"><span>${c.title}</span></button>`).join('')+'</div>':'<p>Your completed pictures will appear here.</p>'}<p class="demo-note">Demo · ${cards.length} / ${DEMO_CARDS.length}</p>`);
  dialog.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{const card=DEMO_CARDS.find(c=>c.id===b.dataset.card);closeDialog();choose(card);});
};
$('solved-flip').onclick=()=>$('flip').click();
function audioSettings(){
  showDialog(`<h2>Sound</h2><label class="volume-control" for="music-volume"><span>Music <output id="music-value">${Math.round(saved.musicVolume*100)}%</output></span><input id="music-volume" type="range" min="0" max="100" value="${Math.round(saved.musicVolume*100)}"></label><label class="volume-control" for="effects-volume"><span>Sound effects <output id="effects-value">${Math.round(saved.effectsVolume*100)}%</output></span><input id="effects-volume" type="range" min="0" max="100" value="${Math.round(saved.effectsVolume*100)}"></label><details class="sound-credits"><summary>Audio credits</summary>${Object.values(DEMO_AUDIO).map(a=>`<p>${a.title} — ${a.author}<br>${a.license}${a.source.startsWith('https://')?`<br><a href="${a.source}" target="_blank" rel="noopener noreferrer">Source</a>`:''}</p>`).join('')}</details><p class="demo-note">Google Play and the Google Play logo are trademarks of Google LLC.</p>`);
  for(const [id,key] of [['music','musicVolume'],['effects','effectsVolume']])$(id+'-volume').oninput=e=>{saved[key]=Number(e.target.value)/100;$(id+'-value').textContent=Math.round(saved[key]*100)+'%';audio.setVolumes(saved.musicVolume,saved.effectsVolume);persist();};
}
$('audio').onclick=audioSettings;
$('theme').onclick=()=>{const modes=['system','light','dark'];saved.theme=modes[(modes.indexOf(saved.theme)+1)%modes.length];applyTheme();persist();toast($('theme').title);};
$('pause').onclick=()=>{
  showDialog(`<h2>${engine.solved()?'Collected!':'Paused'}</h2><div class="dialog-actions"><button class="primary" id="continue">${engine.solved()?'View picture':'Resume puzzle'}</button><button class="glass" id="pause-settings">Sound</button><button class="glass" id="to-gallery">Main menu</button><button class="glass" id="pause-credits">Image credits</button></div>`);
  $('continue').onclick=closeDialog;
  $('pause-settings').onclick=audioSettings;
  $('pause-credits').onclick=()=>{$('credits').click();};
  $('to-gallery').onclick=()=>{closeDialog();home();};
};
$('credits').onclick=()=>{const c=current;showDialog(`<h2>Image credits</h2><p>${c.title}</p><p>${c.author}</p><p>${c.license}</p><div class="source-links"><a href="${c.source}" target="_blank" rel="noopener noreferrer">Image source ↗</a><a href="${c.licenseUrl}" target="_blank" rel="noopener noreferrer">License information ↗</a></div><p>${c.adaptation} Story from the original English Infograf catalog.</p><details><summary>Font licenses</summary><pre class="license-text" id="font-licenses"></pre></details>`);$('font-licenses').textContent=Object.entries(DEMO_FONT_LICENSES).map(([name,text])=>name+'\n'+text).join('\n\n');};
$('next').onclick=()=>{const i=DEMO_CARDS.indexOf(current),next=DEMO_CARDS[(i+1)%DEMO_CARDS.length];choose(next);};
window.addEventListener('pagehide',persist);
home();
</script>
</body></html>
